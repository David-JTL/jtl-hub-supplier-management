name: Build, Deploy & Verify

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: jtlsuppliermgmt
  ACR_LOGIN_SERVER: jtlsuppliermgmt.azurecr.io
  IMAGE_NAME: jtl-hub-supplier-management
  RESOURCE_GROUP: rg-asc-export
  CONTAINER_APP_NAME: supplier-management-app
  CONTAINER_APP_ENV: supplier-management-env
  LOCATION: westeurope

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Set Subscription
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable ACR Admin and Login
        run: |
          az acr update --name ${{ env.ACR_NAME }} --admin-enabled true
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Ensure Container Apps Environment exists
        run: |
          if ! az containerapp env show --name ${{ env.CONTAINER_APP_ENV }} --resource-group ${{ env.RESOURCE_GROUP }} > /dev/null 2>&1; then
            echo "Creating Container Apps Environment..."
            az containerapp env create \
              --name ${{ env.CONTAINER_APP_ENV }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }}
          else
            echo "Container Apps Environment already exists."
          fi

      - name: Re-authenticate before deploy
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Set Subscription for deploy
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        run: |
          # Get ACR credentials
          ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query "username" -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          
          if az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} > /dev/null 2>&1; then
            echo "Updating existing Container App..."
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          else
            echo "Creating new Container App..."
            az containerapp create \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_APP_ENV }} \
              --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --registry-server ${{ env.ACR_LOGIN_SERVER }} \
              --registry-username $ACR_USERNAME \
              --registry-password $ACR_PASSWORD \
              --target-port 8080 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi
          fi

      - name: Get App URL
        id: get-url
        run: |
          FQDN=$(az containerapp show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "APP_URL=https://${FQDN}" >> $GITHUB_OUTPUT
          echo "🚀 App URL: https://${FQDN}"

      - name: Smoke Test — Wait for app to be ready
        run: |
          APP_URL="${{ steps.get-url.outputs.APP_URL }}"
          echo "Waiting for app to be ready at ${APP_URL}..."
          for i in $(seq 1 30); do
            if curl -sf "${APP_URL}/api/health" > /dev/null 2>&1; then
              echo "✅ App is responding after ${i}0 seconds"
              break
            fi
            echo "  Attempt ${i}/30 — not ready yet, waiting 10s..."
            sleep 10
          done

      - name: Smoke Test — Health Endpoint
        run: |
          APP_URL="${{ steps.get-url.outputs.APP_URL }}"
          echo "Testing: ${APP_URL}/api/health"
          
          RESPONSE=$(curl -sf "${APP_URL}/api/health")
          echo "Response: ${RESPONSE}"
          
          if echo "${RESPONSE}" | grep -q '"status":"Healthy"'; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed! Expected 'Healthy' status."
            exit 1
          fi

      - name: Smoke Test — Frontend
        run: |
          APP_URL="${{ steps.get-url.outputs.APP_URL }}"
          echo "Testing: ${APP_URL}/"
          
          HTTP_CODE=$(curl -s -o /tmp/frontend.html -w "%{http_code}" "${APP_URL}/")
          echo "HTTP Status: ${HTTP_CODE}"
          
          if [ "${HTTP_CODE}" -eq 200 ]; then
            echo "✅ Frontend returns HTTP 200"
          else
            echo "❌ Frontend returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          
          if grep -q '<div id="root">' /tmp/frontend.html; then
            echo "✅ Frontend contains React root element"
          else
            echo "❌ Frontend does not contain React root element"
            cat /tmp/frontend.html | head -20
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        run: |
          APP_URL="${{ steps.get-url.outputs.APP_URL }}"
          echo "=============================="
          echo "  DEPLOYMENT SUMMARY"
          echo "=============================="
          echo "  App URL:    ${APP_URL}"
          echo "  Health:     ${APP_URL}/api/health"
          echo "  Swagger:    ${APP_URL}/swagger"
          echo "  Image:      ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "=============================="
